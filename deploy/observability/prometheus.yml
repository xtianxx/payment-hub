# 基准运行期间的 Prometheus 抓取配置。
# 应用指标 127.0.0.1:9091 由 PAYMENT_HUB_METRICS_ADDR 启用；
# PostgreSQL 指标 127.0.0.1:9187 由 postgres-exporter 提供。
global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: payment-hub
    static_configs:
      - targets:
          - 127.0.0.1:9091
  - job_name: postgres
    static_configs:
      - targets:
          - 127.0.0.1:9187
