name: Paired image acceptance (linux/amd64)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOENV: "off"
  GOWORK: "off"
  GOFLAGS: ""
  GOTELEMETRY: "off"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  image-acceptance:
    name: Paired image acceptance (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Isolate image acceptance Go config and caches
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/payment-hub-images"
          mkdir -p "$base/config" "$base/gomod" "$base/gobuild" "$base/gopath" "$base/tmp"
          export XDG_CONFIG_HOME="$base/config"
          export GOPATH="$base/gopath"
          export GOMODCACHE="$base/gomod"
          export GOCACHE="$base/gobuild"
          export TMPDIR="$base/tmp"

          if ! command -v go >/dev/null 2>&1; then
            echo "::error::runner-provided Go is missing; image acceptance cannot continue"
            exit 1
          fi
          if ! go telemetry off; then
            echo "::error::failed to disable Go telemetry in the isolated config"
            exit 1
          fi

          {
            echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME"
            echo "GOPATH=$GOPATH"
            echo "GOMODCACHE=$GOMODCACHE"
            echo "GOCACHE=$GOCACHE"
            echo "TMPDIR=$TMPDIR"
          } >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Go 1.27.4
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          check-latest: false
          cache: false

      - name: Set up Docker 29.9.3 with containerd image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.9.3
          context: payment-hub-check
          set-host: true
          runtime-basedir: ${{ runner.temp }}/payment-hub-docker
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
          github-token: ""

      - name: Verify Docker image store
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DOCKER_HOST:-}" ]]; then
            echo "::error::DOCKER_HOST is not set; DOCKER_CONFIG overrides would bypass the dedicated daemon"
            exit 1
          fi
          if [[ "$(docker version --format '{{.Server.Version}}')" != "29.9.3" ]]; then
            echo "::error::unexpected Docker server version"
            exit 1
          fi
          driver_status="$(docker info --format '{{range .DriverStatus}}{{index . 0}}={{index . 1}}{{"\n"}}{{end}}')"
          if ! grep -Fxq 'driver-type=io.containerd.snapshotter.v1' <<<"$driver_status"; then
            echo "::error::Docker image store is not the containerd snapshotter"
            exit 1
          fi
          daemon_id="$(docker info --format '{{.ID}}')"
          auth_dir="$(mktemp -d)"
          trap 'rm -rf "$auth_dir"' EXIT
          if [[ "$(DOCKER_CONFIG="$auth_dir" docker info --format '{{.ID}}')" != "$daemon_id" ]]; then
            echo "::error::empty DOCKER_CONFIG reaches a different Docker daemon"
            exit 1
          fi

      - name: Build and accept paired images
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOMAXPROCS: "2"
        run: |
          set -euo pipefail
          python3 -B scripts/build-images.py \
            --go "$(command -v go)" \
            --cache-dir "$RUNNER_TEMP/payment-hub-images" \
            --artifact-root "$RUNNER_TEMP/payment-hub-images/artifacts" \
            --prepare-inputs

      - name: Verify image handoff without publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/check-image-handoff.py --build-root "$RUNNER_TEMP/payment-hub-images/artifacts" --artifact-root "$RUNNER_TEMP/payment-hub-handoff-preflight" --isolated-daemon

      - name: Upload safe image acceptance summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-acceptance-safe-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/payment-hub-images/artifacts/upload/build-summary.json
            ${{ runner.temp }}/payment-hub-images/artifacts/upload/images-summary.json
            ${{ runner.temp }}/payment-hub-images/artifacts/upload/handoff-preflight.safe.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
