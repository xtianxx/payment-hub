name: Manual paired image release / 人工配对镜像发布

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation: normal paired publish, or migration package initialization only'
        required: true
        default: publish
        type: choice
        options:
          - publish
          - initialize-migrate
      packages_verified:
        description: 'Package preconditions verified: publish requires both packages existing, public and correctly linked; initialize-migrate requires the app already public and linked, migrate absent, and no other writer active'
        required: true
        default: false
        type: boolean
      confirmation:
        description: 'Confirmation word: PUBLISH for normal publish, or INITIALIZE-MIGRATE-MAY-BECOME-PUBLIC for initialization; first package creation may become public immediately and public content is not guaranteed retractable'
        required: true
        type: string

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOENV: "off"
  GOWORK: "off"
  GOFLAGS: ""
  GOTELEMETRY: "off"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  resolve-candidate:
    name: Resolve release candidate (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      ci_run_id: ${{ steps.select-candidate.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.select-candidate.outputs.ci_run_attempt }}
      bundle_artifact_id: ${{ steps.verify-candidate.outputs.bundle_artifact_id }}
      descriptor_sha256: ${{ steps.verify-candidate.outputs.descriptor_sha256 }}
      bundle_artifact_digest: ${{ steps.verify-candidate.outputs.bundle_artifact_digest }}

    steps:
      - name: Verify manual operation preconditions
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OPERATION: ${{ inputs.operation }}
          PACKAGES_VERIFIED: ${{ inputs.packages_verified }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_ACTOR" != "xtianxx" || "$RELEASE_TRIGGERING_ACTOR" != "xtianxx" ]]; then
            echo "::error::owner-only publish requires actor and triggering actor xtianxx"
            exit 1
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::publish requires workflow_dispatch"
            exit 1
          fi
          if [[ "$REF_NAME" != "refs/heads/main" ]]; then
            echo "::error::publish requires refs/heads/main"
            exit 1
          fi
          if [[ "$REPOSITORY" != "xtianxx/payment-hub" ]]; then
            echo "::error::publish requires the trusted repository"
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::publish requires a 40-hex source SHA"
            exit 1
          fi
          case "$OPERATION" in
            publish)
              if [[ "$PACKAGES_VERIFIED" != "true" ]]; then
                echo "::error::publish requires packages_verified=true"
                exit 1
              fi
              expected="PUBLISH"
              ;;
            initialize-migrate)
              if [[ "$PACKAGES_VERIFIED" != "true" ]]; then
                echo "::error::initialize-migrate requires packages_verified=true"
                exit 1
              fi
              expected="INITIALIZE-MIGRATE-MAY-BECOME-PUBLIC"
              ;;
            *)
              echo "::error::OPERATION must be publish or initialize-migrate"
              exit 1
              ;;
          esac
          python3 -I - "$expected" <<'PY'
          import json
          import os
          import sys
          def fail():
              print("::error::confirmation input is missing or invalid")
              raise SystemExit(1)
          try:
              expected = sys.argv[1]
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
                  event = json.load(handle)
              if not isinstance(event, dict):
                  fail()
              inputs = event.get("inputs")
              if not isinstance(inputs, dict):
                  fail()
              confirmation = inputs.get("confirmation")
              if not isinstance(confirmation, str) or confirmation != expected:
                  fail()
          except SystemExit:
              raise
          except Exception:
              fail()
          PY

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Select release candidate
        id: select-candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -B scripts/select-release-candidate.py select --source-sha "$SOURCE_SHA" --summary "$RUNNER_TEMP/payment-hub-release-selection/selection.json" --github-output "$GITHUB_OUTPUT"

      - name: Download release candidate pointer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.select-candidate.outputs.pointer_artifact_id }}
          run-id: ${{ steps.select-candidate.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/payment-hub-release-pointer
          merge-multiple: true
          digest-mismatch: error

      - name: Verify release candidate
        id: verify-candidate
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -B scripts/select-release-candidate.py verify --source-sha "$SOURCE_SHA" --selection "$RUNNER_TEMP/payment-hub-release-selection/selection.json" --pointer "$RUNNER_TEMP/payment-hub-release-pointer/pointer.json" --github-output "$GITHUB_OUTPUT"

  upload:
    name: Publish paired images (linux/amd64)
    needs: resolve-candidate
    if: ${{ github.actor == 'xtianxx' && github.triggering_actor == 'xtianxx' && inputs.operation == 'publish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Verify resolved candidate identity
        shell: bash
        env:
          CI_RUN_ID: ${{ needs.resolve-candidate.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.resolve-candidate.outputs.ci_run_attempt }}
          BUNDLE_ARTIFACT_ID: ${{ needs.resolve-candidate.outputs.bundle_artifact_id }}
          BUNDLE_ARTIFACT_DIGEST: ${{ needs.resolve-candidate.outputs.bundle_artifact_digest }}
          EXPECTED_DESCRIPTOR_SHA: ${{ needs.resolve-candidate.outputs.descriptor_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$CI_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$CI_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::resolved candidate must bind a positive CI run id and attempt"
            exit 1
          fi
          if [[ ! "$BUNDLE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::resolved candidate bundle artifact id is invalid"
            exit 1
          fi
          if [[ ! "$BUNDLE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::resolved candidate bundle artifact digest is not canonical sha256:64-hex"
            exit 1
          fi
          if [[ ! "$EXPECTED_DESCRIPTOR_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::expected descriptor digest is not 64-hex"
            exit 1
          fi

      - name: Isolate release Go config and caches
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/payment-hub-release-cache"
          mkdir -p "$base/config" "$base/gomod" "$base/gobuild" "$base/gopath" "$base/tmp"
          export XDG_CONFIG_HOME="$base/config"
          export GOPATH="$base/gopath"
          export GOMODCACHE="$base/gomod"
          export GOCACHE="$base/gobuild"
          export TMPDIR="$base/tmp"

          if ! command -v go >/dev/null 2>&1; then
            echo "::error::runner-provided Go is missing; release publish cannot continue"
            exit 1
          fi
          if ! go telemetry off; then
            echo "::error::failed to disable Go telemetry in the isolated config"
            exit 1
          fi

          {
            echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME"
            echo "GOPATH=$GOPATH"
            echo "GOMODCACHE=$GOMODCACHE"
            echo "GOCACHE=$GOCACHE"
            echo "TMPDIR=$TMPDIR"
          } >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Go 1.27.4
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          check-latest: false
          cache: false

      - name: Set up Docker 29.9.3 with containerd image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.9.3
          context: payment-hub-release
          set-host: true
          runtime-basedir: ${{ runner.temp }}/payment-hub-docker
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
          github-token: ""

      - name: Verify Docker image store
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DOCKER_HOST:-}" ]]; then
            echo "::error::DOCKER_HOST is not set; DOCKER_CONFIG overrides would bypass the dedicated daemon"
            exit 1
          fi
          if [[ "$(docker version --format '{{.Server.Version}}')" != "29.9.3" ]]; then
            echo "::error::unexpected Docker server version"
            exit 1
          fi
          driver_status="$(docker info --format '{{range .DriverStatus}}{{index . 0}}={{index . 1}}{{"\n"}}{{end}}')"
          if ! grep -Fxq 'driver-type=io.containerd.snapshotter.v1' <<<"$driver_status"; then
            echo "::error::Docker image store is not the containerd snapshotter"
            exit 1
          fi
          daemon_id="$(docker info --format '{{.ID}}')"
          auth_dir="$(mktemp -d)"
          trap 'rm -rf "$auth_dir"' EXIT
          if [[ "$(DOCKER_CONFIG="$auth_dir" docker info --format '{{.ID}}')" != "$daemon_id" ]]; then
            echo "::error::empty DOCKER_CONFIG reaches a different Docker daemon"
            exit 1
          fi

      - name: Prepare handoff download directory
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/payment-hub-release-bundle"

      - name: Download release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.resolve-candidate.outputs.bundle_artifact_id }}
          run-id: ${{ needs.resolve-candidate.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/payment-hub-release-bundle
          merge-multiple: true
          digest-mismatch: error

      - name: Restrict handoff bundle permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod 0600 \
            "$RUNNER_TEMP/payment-hub-release-bundle/pair.tar" \
            "$RUNNER_TEMP/payment-hub-release-bundle/descriptor.json" \
            "$RUNNER_TEMP/payment-hub-release-bundle/build-record.json" \
            "$RUNNER_TEMP/payment-hub-release-bundle/accepted-images.json"

      - name: Verify release handoff
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_DESCRIPTOR_SHA: ${{ needs.resolve-candidate.outputs.descriptor_sha256 }}
        run: |
          set -euo pipefail
          bash scripts/release.sh --stage verify-handoff \
            --source-sha "$SOURCE_SHA" \
            --bundle-dir "$RUNNER_TEMP/payment-hub-release-bundle" \
            --expected-descriptor-sha256 "$EXPECTED_DESCRIPTOR_SHA"

      - name: Require successful main CI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ needs.resolve-candidate.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.resolve-candidate.outputs.ci_run_attempt }}
        run: |
          set -euo pipefail
          python3 -B scripts/check-main-ci.py --source-sha "$SOURCE_SHA" --summary "$RUNNER_TEMP/payment-hub-ci-gate/ci-preflight.json" --expected-run-id "$CI_RUN_ID" --expected-run-attempt "$CI_RUN_ATTEMPT"

      - name: Publish paired images
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_DESCRIPTOR_SHA: ${{ needs.resolve-candidate.outputs.descriptor_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
          GHCR_PACKAGE_AUDIT_TOKEN: ${{ secrets.GHCR_PACKAGE_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/release.sh --stage publish \
            --source-sha "$SOURCE_SHA" \
            --go "$(command -v go)" \
            --cache-dir "$RUNNER_TEMP/payment-hub-release-cache" \
            --artifact-root "$RUNNER_TEMP/payment-hub-release-publish" \
            --bundle-dir "$RUNNER_TEMP/payment-hub-release-bundle" \
            --expected-descriptor-sha256 "$EXPECTED_DESCRIPTOR_SHA" \
            --approve-external \
            --package-preconditions-verified \
            --prepare-inputs

      - name: Write release evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_RUN_ID: ${{ needs.resolve-candidate.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.resolve-candidate.outputs.ci_run_attempt }}
          BUNDLE_ARTIFACT_ID: ${{ needs.resolve-candidate.outputs.bundle_artifact_id }}
          BUNDLE_ARTIFACT_DIGEST: ${{ needs.resolve-candidate.outputs.bundle_artifact_digest }}
          EXPECTED_DESCRIPTOR_SHA: ${{ needs.resolve-candidate.outputs.descriptor_sha256 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -I - "$SOURCE_SHA" "$RELEASE_RUN_ID" "$RELEASE_RUN_ATTEMPT" "$CI_RUN_ID" "$CI_RUN_ATTEMPT" "$BUNDLE_ARTIFACT_ID" "$BUNDLE_ARTIFACT_DIGEST" "$EXPECTED_DESCRIPTOR_SHA" "$REPOSITORY" <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import sys
          from pathlib import Path

          TRUSTED_REPOSITORY = "xtianxx/payment-hub"
          EVIDENCE_SCHEMA = "payment-hub.release-evidence.v1"
          MAX_DESCRIPTOR_BYTES = 64 * 1024
          DESCRIPTOR_SOURCE = Path("payment-hub-release-bundle") / "descriptor.json"
          PUBLISH_ROOT = Path("payment-hub-release-publish")
          SUMMARY_FILE = "release-summary.json"
          DESCRIPTOR_FILE = "descriptor.json"
          EVIDENCE_FILE = "release-evidence.json"


          def fail(message):
              print("::error::" + message)
              raise SystemExit(1)


          def positive(value):
              if re.fullmatch(r"[1-9][0-9]*", value) is None:
                  fail("release evidence requires a positive decimal identifier")
              return int(value)


          def write_exclusive(path, data):
              try:
                  descriptor = os.open(
                      path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600
                  )
              except OSError:
                  fail("release evidence destination is unavailable")
              try:
                  with os.fdopen(descriptor, "wb") as handle:
                      handle.write(data)
                      handle.flush()
                      os.fsync(handle.fileno())
              except OSError:
                  fail("release evidence write failed")


          def main():
              if len(sys.argv) != 10:
                  fail("release evidence arguments are incomplete")
              (
                  source_sha,
                  release_run_id,
                  release_run_attempt,
                  ci_run_id,
                  ci_run_attempt,
                  bundle_artifact_id,
                  bundle_artifact_digest,
                  descriptor_sha256,
                  repository,
              ) = sys.argv[1:]
              if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
                  fail("release evidence requires a 40-hex source SHA")
              if repository != TRUSTED_REPOSITORY:
                  fail("release evidence requires the trusted repository")
              if re.fullmatch(r"sha256:[0-9a-f]{64}", bundle_artifact_digest) is None:
                  fail("release evidence requires a canonical bundle artifact digest")
              if re.fullmatch(r"[0-9a-f]{64}", descriptor_sha256) is None:
                  fail("release evidence requires a bare 64-hex descriptor digest")
              evidence = {
                  "schema": EVIDENCE_SCHEMA,
                  "repository": TRUSTED_REPOSITORY,
                  "source_sha": source_sha,
                  "release_run_id": positive(release_run_id),
                  "release_run_attempt": positive(release_run_attempt),
                  "ci_run_id": positive(ci_run_id),
                  "ci_run_attempt": positive(ci_run_attempt),
                  "bundle_artifact_id": positive(bundle_artifact_id),
                  "bundle_artifact_digest": bundle_artifact_digest,
                  "descriptor_sha256": descriptor_sha256,
              }
              runner_temp = os.environ.get("RUNNER_TEMP", "")
              if not runner_temp or not os.path.isabs(runner_temp):
                  fail("release evidence requires an absolute RUNNER_TEMP")
              root = Path(runner_temp) / PUBLISH_ROOT
              source = Path(runner_temp) / DESCRIPTOR_SOURCE
              summary = root / SUMMARY_FILE
              destination = root / DESCRIPTOR_FILE
              evidence_path = root / EVIDENCE_FILE
              try:
                  root_info = root.lstat()
                  summary_info = summary.lstat()
                  source_info = source.lstat()
              except OSError:
                  fail("release evidence inputs are missing")
              if (
                  root.is_symlink()
                  or not stat.S_ISDIR(root_info.st_mode)
                  or summary.is_symlink()
                  or not stat.S_ISREG(summary_info.st_mode)
                  or source.is_symlink()
                  or not stat.S_ISREG(source_info.st_mode)
              ):
                  fail("release evidence inputs are not regular files")
              if source_info.st_size <= 0 or source_info.st_size > MAX_DESCRIPTOR_BYTES:
                  fail("downloaded descriptor size is invalid")
              try:
                  original = source.read_bytes()
              except OSError:
                  fail("downloaded descriptor cannot be read")
              if hashlib.sha256(original).hexdigest() != descriptor_sha256:
                  fail("downloaded descriptor does not match the trusted digest")
              write_exclusive(destination, original)
              try:
                  copied = destination.read_bytes()
                  original_after = source.read_bytes()
              except OSError:
                  fail("copied descriptor cannot be read")
              if hashlib.sha256(copied).hexdigest() != descriptor_sha256:
                  fail("copied descriptor does not match the trusted digest")
              if hashlib.sha256(original_after).hexdigest() != descriptor_sha256:
                  fail("downloaded descriptor changed during copy")
              text = json.dumps(evidence, indent=2, sort_keys=True) + "\n"
              write_exclusive(evidence_path, text.encode("utf-8"))


          if __name__ == "__main__":
              main()
          PY

      - name: Upload release summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/payment-hub-release-publish/release-summary.json
            ${{ runner.temp }}/payment-hub-release-publish/descriptor.json
            ${{ runner.temp }}/payment-hub-release-publish/release-evidence.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

  initialize-migrate:
    name: Initialize migration package (linux/amd64)
    needs: resolve-candidate
    if: ${{ github.actor == 'xtianxx' && github.triggering_actor == 'xtianxx' && inputs.operation == 'initialize-migrate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Verify resolved candidate identity
        shell: bash
        env:
          CI_RUN_ID: ${{ needs.resolve-candidate.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.resolve-candidate.outputs.ci_run_attempt }}
          BUNDLE_ARTIFACT_ID: ${{ needs.resolve-candidate.outputs.bundle_artifact_id }}
          BUNDLE_ARTIFACT_DIGEST: ${{ needs.resolve-candidate.outputs.bundle_artifact_digest }}
          EXPECTED_DESCRIPTOR_SHA: ${{ needs.resolve-candidate.outputs.descriptor_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$CI_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$CI_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::resolved candidate must bind a positive CI run id and attempt"
            exit 1
          fi
          if [[ ! "$BUNDLE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::resolved candidate bundle artifact id is invalid"
            exit 1
          fi
          if [[ ! "$BUNDLE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::resolved candidate bundle artifact digest is not canonical sha256:64-hex"
            exit 1
          fi
          if [[ ! "$EXPECTED_DESCRIPTOR_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::expected descriptor digest is not 64-hex"
            exit 1
          fi

      - name: Isolate initialization Go config and caches
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/payment-hub-initialization"
          mkdir -p "$base/config" "$base/gomod" "$base/gobuild" "$base/gopath" "$base/tmp"
          export XDG_CONFIG_HOME="$base/config"
          export GOPATH="$base/gopath"
          export GOMODCACHE="$base/gomod"
          export GOCACHE="$base/gobuild"
          export TMPDIR="$base/tmp"

          if ! command -v go >/dev/null 2>&1; then
            echo "::error::runner-provided Go is missing; initialization cannot continue"
            exit 1
          fi
          if ! go telemetry off; then
            echo "::error::failed to disable Go telemetry in the isolated config"
            exit 1
          fi

          {
            echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME"
            echo "GOPATH=$GOPATH"
            echo "GOMODCACHE=$GOMODCACHE"
            echo "GOCACHE=$GOCACHE"
            echo "TMPDIR=$TMPDIR"
          } >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Go 1.27.4
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          check-latest: false
          cache: false

      - name: Set up Docker 29.9.3 with containerd image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.9.3
          context: payment-hub-initialization
          set-host: true
          runtime-basedir: ${{ runner.temp }}/payment-hub-docker
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
          github-token: ""

      - name: Verify Docker image store
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DOCKER_HOST:-}" ]]; then
            echo "::error::DOCKER_HOST is not set; DOCKER_CONFIG overrides would bypass the dedicated daemon"
            exit 1
          fi
          if [[ "$(docker version --format '{{.Server.Version}}')" != "29.9.3" ]]; then
            echo "::error::unexpected Docker server version"
            exit 1
          fi
          driver_status="$(docker info --format '{{range .DriverStatus}}{{index . 0}}={{index . 1}}{{"\n"}}{{end}}')"
          if ! grep -Fxq 'driver-type=io.containerd.snapshotter.v1' <<<"$driver_status"; then
            echo "::error::Docker image store is not the containerd snapshotter"
            exit 1
          fi
          daemon_id="$(docker info --format '{{.ID}}')"
          auth_dir="$(mktemp -d)"
          trap 'rm -rf "$auth_dir"' EXIT
          if [[ "$(DOCKER_CONFIG="$auth_dir" docker info --format '{{.ID}}')" != "$daemon_id" ]]; then
            echo "::error::empty DOCKER_CONFIG reaches a different Docker daemon"
            exit 1
          fi

      - name: Prepare initialization download directory
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/payment-hub-initialization-bundle"

      - name: Download initialization bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.resolve-candidate.outputs.bundle_artifact_id }}
          run-id: ${{ needs.resolve-candidate.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/payment-hub-initialization-bundle
          merge-multiple: true
          digest-mismatch: error

      - name: Restrict initialization bundle permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod 0600 \
            "$RUNNER_TEMP/payment-hub-initialization-bundle/pair.tar" \
            "$RUNNER_TEMP/payment-hub-initialization-bundle/descriptor.json" \
            "$RUNNER_TEMP/payment-hub-initialization-bundle/build-record.json" \
            "$RUNNER_TEMP/payment-hub-initialization-bundle/accepted-images.json"

      - name: Verify initialization handoff
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_DESCRIPTOR_SHA: ${{ needs.resolve-candidate.outputs.descriptor_sha256 }}
        run: |
          set -euo pipefail
          bash scripts/release.sh --stage verify-handoff \
            --source-sha "$SOURCE_SHA" \
            --bundle-dir "$RUNNER_TEMP/payment-hub-initialization-bundle" \
            --expected-descriptor-sha256 "$EXPECTED_DESCRIPTOR_SHA"

      - name: Require successful main CI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ needs.resolve-candidate.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.resolve-candidate.outputs.ci_run_attempt }}
        run: |
          set -euo pipefail
          python3 -B scripts/check-main-ci.py --source-sha "$SOURCE_SHA" --summary "$RUNNER_TEMP/payment-hub-ci-gate/ci-preflight.json" --expected-run-id "$CI_RUN_ID" --expected-run-attempt "$CI_RUN_ATTEMPT"

      - name: Initialize migration package
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ needs.resolve-candidate.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.resolve-candidate.outputs.ci_run_attempt }}
          BUNDLE_ARTIFACT_ID: ${{ needs.resolve-candidate.outputs.bundle_artifact_id }}
          BUNDLE_ARTIFACT_DIGEST: ${{ needs.resolve-candidate.outputs.bundle_artifact_digest }}
          EXPECTED_DESCRIPTOR_SHA: ${{ needs.resolve-candidate.outputs.descriptor_sha256 }}
          PAYMENT_HUB_RELEASE_OPERATION: ${{ inputs.operation }}
          GITHUB_TOKEN: ${{ github.token }}
          GHCR_PACKAGE_AUDIT_TOKEN: ${{ secrets.GHCR_PACKAGE_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          python3 -B scripts/init-migrate-package.py --source-sha "$SOURCE_SHA" --ci-run-id "$CI_RUN_ID" --ci-run-attempt "$CI_RUN_ATTEMPT" --bundle-artifact-id "$BUNDLE_ARTIFACT_ID" --bundle-artifact-digest "$BUNDLE_ARTIFACT_DIGEST" --bundle-dir "$RUNNER_TEMP/payment-hub-initialization-bundle" --expected-descriptor-sha256 "$EXPECTED_DESCRIPTOR_SHA" --artifact-root "$RUNNER_TEMP/payment-hub-migrate-initialization" --go "$(command -v go)" --cache-dir "$RUNNER_TEMP/payment-hub-initialization" --prepare-inputs --approve-initialization --acknowledge-public-creation --initialization-preconditions-verified

      - name: Upload migration initialization summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migrate-initialization-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/payment-hub-migrate-initialization/initialization-summary.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
