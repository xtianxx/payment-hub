name: Manual paired image publish / 人工配对镜像发布

on:
  workflow_dispatch:
    inputs:
      publish_authorized:
        description: Explicit authorization to publish the prepared pair
        required: true
        default: false
        type: boolean
      packages_verified:
        description: Package preconditions verified before upload
        required: true
        default: false
        type: boolean

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOENV: "off"
  GOWORK: "off"
  GOFLAGS: ""
  GOTELEMETRY: "off"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  prepare:
    name: Prepare release handoff (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.bundle.outputs.artifact-digest }}
      source_sha: ${{ steps.handoff.outputs.source_sha }}
      descriptor_sha256: ${{ steps.handoff.outputs.descriptor_sha256 }}

    steps:
      - name: Verify manual publish preconditions
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          PUBLISH_AUTHORIZED: ${{ inputs.publish_authorized }}
          PACKAGES_VERIFIED: ${{ inputs.packages_verified }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::publish requires workflow_dispatch"
            exit 1
          fi
          if [[ "$REF_NAME" != "refs/heads/main" ]]; then
            echo "::error::publish requires refs/heads/main"
            exit 1
          fi
          if [[ "$REPOSITORY" != "xtianxx/payment-hub" ]]; then
            echo "::error::publish requires the trusted repository"
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::publish requires a 40-hex source SHA"
            exit 1
          fi
          if [[ "$PUBLISH_AUTHORIZED" != "true" || "$PACKAGES_VERIFIED" != "true" ]]; then
            echo "::error::publish requires both manual authorizations"
            exit 1
          fi

      - name: Isolate release Go config and caches
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/payment-hub-release-cache"
          mkdir -p "$base/config" "$base/gomod" "$base/gobuild" "$base/gopath" "$base/tmp"
          export XDG_CONFIG_HOME="$base/config"
          export GOPATH="$base/gopath"
          export GOMODCACHE="$base/gomod"
          export GOCACHE="$base/gobuild"
          export TMPDIR="$base/tmp"

          if ! command -v go >/dev/null 2>&1; then
            echo "::error::runner-provided Go is missing; release prepare cannot continue"
            exit 1
          fi
          if ! go telemetry off; then
            echo "::error::failed to disable Go telemetry in the isolated config"
            exit 1
          fi

          {
            echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME"
            echo "GOPATH=$GOPATH"
            echo "GOMODCACHE=$GOMODCACHE"
            echo "GOCACHE=$GOCACHE"
            echo "TMPDIR=$TMPDIR"
          } >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Require successful main CI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -B scripts/check-main-ci.py --source-sha "$SOURCE_SHA" --summary "$RUNNER_TEMP/payment-hub-ci-gate/ci-preflight.json"

      - name: Set up Go 1.27.4
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          check-latest: false
          cache: false

      - name: Set up Docker 29.9.3 with containerd image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.9.3
          context: payment-hub-release
          set-host: true
          runtime-basedir: ${{ runner.temp }}/payment-hub-docker
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
          github-token: ""

      - name: Verify Docker image store
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DOCKER_HOST:-}" ]]; then
            echo "::error::DOCKER_HOST is not set; DOCKER_CONFIG overrides would bypass the dedicated daemon"
            exit 1
          fi
          if [[ "$(docker version --format '{{.Server.Version}}')" != "29.9.3" ]]; then
            echo "::error::unexpected Docker server version"
            exit 1
          fi
          driver_status="$(docker info --format '{{range .DriverStatus}}{{index . 0}}={{index . 1}}{{"\n"}}{{end}}')"
          if ! grep -Fxq 'driver-type=io.containerd.snapshotter.v1' <<<"$driver_status"; then
            echo "::error::Docker image store is not the containerd snapshotter"
            exit 1
          fi
          daemon_id="$(docker info --format '{{.ID}}')"
          auth_dir="$(mktemp -d)"
          trap 'rm -rf "$auth_dir"' EXIT
          if [[ "$(DOCKER_CONFIG="$auth_dir" docker info --format '{{.ID}}')" != "$daemon_id" ]]; then
            echo "::error::empty DOCKER_CONFIG reaches a different Docker daemon"
            exit 1
          fi

      - name: Prepare release handoff
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/release.sh --stage prepare \
            --source-sha "$SOURCE_SHA" \
            --go "$(command -v go)" \
            --cache-dir "$RUNNER_TEMP/payment-hub-release-cache" \
            --artifact-root "$RUNNER_TEMP/payment-hub-release-prepare" \
            --prepare-inputs

      - name: Read trusted prepare outputs
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import os
          import re
          path = os.path.join(os.environ["RUNNER_TEMP"], "payment-hub-release-prepare", "handoff.json")
          with open(path, "r", encoding="utf-8") as handle:
              data = json.load(handle)
          source_sha = data.get("source_sha")
          descriptor_sha256 = data.get("descriptor_sha256")
          if not isinstance(source_sha, str) or re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit("invalid source_sha")
          if not isinstance(descriptor_sha256, str) or re.fullmatch(r"[0-9a-f]{64}", descriptor_sha256) is None:
              raise SystemExit("invalid descriptor_sha256")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"source_sha={source_sha}\n")
              handle.write(f"descriptor_sha256={descriptor_sha256}\n")
          PY

      - name: Upload release bundle
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/payment-hub-release-prepare/bundle/pair.tar
            ${{ runner.temp }}/payment-hub-release-prepare/bundle/descriptor.json
            ${{ runner.temp }}/payment-hub-release-prepare/bundle/build-record.json
            ${{ runner.temp }}/payment-hub-release-prepare/bundle/accepted-images.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

  upload:
    name: Publish paired images (linux/amd64)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Verify release handoff identity
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PREPARED_SHA: ${{ needs.prepare.outputs.source_sha }}
          EXPECTED_DESCRIPTOR_SHA: ${{ needs.prepare.outputs.descriptor_sha256 }}
        run: |
          set -euo pipefail
          if [[ "$PREPARED_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::prepared source SHA does not match github.sha"
            exit 1
          fi
          if [[ ! "$EXPECTED_DESCRIPTOR_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::expected descriptor digest is not 64-hex"
            exit 1
          fi

      - name: Isolate release Go config and caches
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/payment-hub-release-cache"
          mkdir -p "$base/config" "$base/gomod" "$base/gobuild" "$base/gopath" "$base/tmp"
          export XDG_CONFIG_HOME="$base/config"
          export GOPATH="$base/gopath"
          export GOMODCACHE="$base/gomod"
          export GOCACHE="$base/gobuild"
          export TMPDIR="$base/tmp"

          if ! command -v go >/dev/null 2>&1; then
            echo "::error::runner-provided Go is missing; release publish cannot continue"
            exit 1
          fi
          if ! go telemetry off; then
            echo "::error::failed to disable Go telemetry in the isolated config"
            exit 1
          fi

          {
            echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME"
            echo "GOPATH=$GOPATH"
            echo "GOMODCACHE=$GOMODCACHE"
            echo "GOCACHE=$GOCACHE"
            echo "TMPDIR=$TMPDIR"
          } >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Go 1.27.4
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          check-latest: false
          cache: false

      - name: Set up Docker 29.9.3 with containerd image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.9.3
          context: payment-hub-release
          set-host: true
          runtime-basedir: ${{ runner.temp }}/payment-hub-docker
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
          github-token: ""

      - name: Verify Docker image store
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DOCKER_HOST:-}" ]]; then
            echo "::error::DOCKER_HOST is not set; DOCKER_CONFIG overrides would bypass the dedicated daemon"
            exit 1
          fi
          if [[ "$(docker version --format '{{.Server.Version}}')" != "29.9.3" ]]; then
            echo "::error::unexpected Docker server version"
            exit 1
          fi
          driver_status="$(docker info --format '{{range .DriverStatus}}{{index . 0}}={{index . 1}}{{"\n"}}{{end}}')"
          if ! grep -Fxq 'driver-type=io.containerd.snapshotter.v1' <<<"$driver_status"; then
            echo "::error::Docker image store is not the containerd snapshotter"
            exit 1
          fi
          daemon_id="$(docker info --format '{{.ID}}')"
          auth_dir="$(mktemp -d)"
          trap 'rm -rf "$auth_dir"' EXIT
          if [[ "$(DOCKER_CONFIG="$auth_dir" docker info --format '{{.ID}}')" != "$daemon_id" ]]; then
            echo "::error::empty DOCKER_CONFIG reaches a different Docker daemon"
            exit 1
          fi

      - name: Prepare handoff download directory
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/payment-hub-release-handoff"

      - name: Download release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/payment-hub-release-handoff
          merge-multiple: true
          digest-mismatch: error

      - name: Restrict handoff bundle permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod 0600 \
            "$RUNNER_TEMP/payment-hub-release-handoff/pair.tar" \
            "$RUNNER_TEMP/payment-hub-release-handoff/descriptor.json" \
            "$RUNNER_TEMP/payment-hub-release-handoff/build-record.json" \
            "$RUNNER_TEMP/payment-hub-release-handoff/accepted-images.json"

      - name: Require successful main CI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -B scripts/check-main-ci.py --source-sha "$SOURCE_SHA" --summary "$RUNNER_TEMP/payment-hub-ci-gate/ci-preflight.json"

      - name: Publish paired images
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_DESCRIPTOR_SHA: ${{ needs.prepare.outputs.descriptor_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/release.sh --stage publish \
            --source-sha "$SOURCE_SHA" \
            --go "$(command -v go)" \
            --cache-dir "$RUNNER_TEMP/payment-hub-release-cache" \
            --artifact-root "$RUNNER_TEMP/payment-hub-release-publish" \
            --bundle-dir "$RUNNER_TEMP/payment-hub-release-handoff" \
            --expected-descriptor-sha256 "$EXPECTED_DESCRIPTOR_SHA" \
            --approve-external \
            --package-preconditions-verified \
            --prepare-inputs

      - name: Upload release summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/payment-hub-release-publish/release-summary.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
